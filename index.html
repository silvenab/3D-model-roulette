<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Roulette</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🎲 Model Roulette</h1>
      <p>Крути категорию, потом предмет. На модель — 12 или 24 часа.</p>
    </header>

    <!-- ЭТАП 1: колесо категорий -->
    <section class="stage" id="stage-category">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <div class="wheel" id="category-wheel"></div>
        <div class="wheel-hub">🎲</div>
      </div>
      <div class="legend" id="legend"></div>
      <button class="spin-btn" id="spin-category">КРУТИТЬ</button>
    </section>

    <!-- ЭТАП 2: рулетка предметов -->
    <section class="stage hidden" id="stage-item">
      <div class="category-badge" id="current-category">—</div>
      <div class="reel-viewport">
        <div class="reel-track" id="reel-track">
          <div class="reel-item">- - -</div>
          <div class="reel-item">ЖМИ КРУТИТЬ</div>
          <div class="reel-item">- - -</div>
        </div>
        <div class="reel-highlight"></div>
      </div>
      <button class="spin-btn" id="spin-item">КРУТИТЬ</button>
    </section>

    <!-- ЭТАП 3: результат -->
    <section class="stage hidden" id="stage-result">
      <div class="result-card" id="result-card">
        <div class="result-rare hidden" id="result-rare">✨ РЕДКИЙ ДРОП ✨</div>
        <div class="result-category" id="result-category"></div>
        <div class="result-item" id="result-item"></div>
        <div class="timer" id="timer">00:00:00</div>
        <div class="timer-label" id="timer-label">до дедлайна</div>
      </div>
      
      <div class="result-actions">
        <button class="spin-btn" id="done-btn">✓ ГОТОВО (С ТЕКСТУРАМИ)</button>
        <button class="spin-btn secondary" id="done-notex-btn">✓ ГОТОВО (БЕЗ ТЕКСТУР)</button>
        <button class="spin-btn reroll-btn hidden" id="reroll-btn">ОБСУДИТЬ / ПЕРЕКРУТИТЬ</button>
      </div>
    </section>

    <!-- Лидерборд -->
    <section class="leaderboard">
      <div class="lb-header">
        <h2>🏆 Лидерборд — <span id="current-month-label">—</span></h2>
        <div class="my-score">Мой счет: <span id="my-score-val">0</span></div>
      </div>
      <ul id="leaderboard-list">
        <li>Загрузка...</li>
      </ul>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
